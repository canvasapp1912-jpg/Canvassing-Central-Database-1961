function spDash(){const rr=ARf().map(a=>{const x=M(a[1]),sh=v=>x.ct?(v/x.ct*100).toFixed(0):0;return`<tr><td>${a[0]}</td><td><b>${n(x.ct)}</b> / ${n(reg(a[1]))}</td><td><b>${n(x.sup)}</b> / ${n(x.need)}<br>${chip(x.sup,x.need)}</td><td><b>${n(x.und)}</b><br><small>${sh(x.und)}% of contacted</small></td><td><b>${n(x.ag)}</b><br><small>${sh(x.ag)}% of contacted</small></td></tr>`}).join("");
 return`<h2>ANC support vs targets</h2><div class="c w tt"><table><tr><th>District</th><th>Contacted<br><small>of voters</small></th><th>ANC Support<br><small>met / target</small></th><th>Undecided</th><th>Against ANC</th></tr>${rr}</table></div>`}
function svDash(){const rr=ARf().map(a=>{let el=0,ar=0,ct=0,su=0,un=0,ag=0;R.forEach(r=>{if(r[5]<60||(a[1]!="all"&&r[0]!=a[1]))return;el++;const x=V[key(r)];if(!x)return;if(x.sv)ar++;if(x.s){ct++;if(x.s=="S")su++;else if(x.s=="U")un++;else ag++}});const tg=Math.ceil(el*cfg.turn/100*cfg.win/100);return`<tr><td>${a[0]}</td><td><b>${n(el)}</b></td><td><b>${ar}</b> / ${el}<br>${chip(ar,el)}</td><td>${ct}</td><td><b>${su}</b> / ${tg}<br>${chip(su,tg)}</td><td>${un}</td><td>${ag}</td></tr>`}).join("");
 return`<h2>Special votes (voters aged 60+)</h2><div class="c w tt"><table><tr><th>District</th><th>Eligible<br><small>aged 60+</small></th><th>Special vote arranged<br><small>done / eligible</small></th><th>Contacted</th><th>ANC Support<br><small>met / target</small></th><th>Undecided</th><th>Against ANC</th></tr>${rr}</table><small class="mu">Special vote arranged is ticked per voter on the Voters Roll. Support target = eligible × turnout × winning share.</small></div>`}
